<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/login.css">
    <script src="../js/cadastro.js" defer></script>

    <title>Cadastro</title>
</head>

<body class="login-page">
    <main class="login-card">
        <p class="bem-vindo">Registre-se</p>
        <p class="cadastro-txt">Possui conta? <a class="cadastro" href="login.html">Entrar</a></p>
        
        <form class="login-form" id="form-cadastro">
            <label for="nome">Nome Completo</label>
            <input id="nome" name="nome" type="text" placeholder="Ex: Victória Dantas" autocomplete="name" required>

            <label for="cpf_cnpj">CPF ou CNPJ</label>
            <input id="cpf_cnpj" name="cpf_cnpj" type="text" maxlength="18" placeholder="Ex: 123.456.789-09" required>

            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" maxlength="15" placeholder="Ex: (11) 99413-2000" autocomplete="tel" required>

            <label for="endereco">Endereço</label>
            <input id="endereco" name="endereco" type="text" maxlength="255" placeholder="Ex: Rua das Flores, 123 - Centro" autocomplete="street-address" required>
            
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="new-password" required>

            <label for="conf_senha">Confirmar Senha</label>
            <input id="conf_senha" name="conf_senha" type="password" placeholder="Digite novamente sua senha" autocomplete="new-password" required>

            <button class="button button-primary" type="submit">Cadastrar conta <span>→</span></button>

            <p class="login-message" id="mensagem_cadastro" role="status"></p>
        </form>

        <a class="back-home" href="index.html">← Voltar para a loja</a>
    </main>
</body>

</html>
