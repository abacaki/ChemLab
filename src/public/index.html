<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemLab - Catálogo e Loja</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">ChemLab</div>
        <nav>
            <span id="usuario-logado"></span>
            <a href="login.html" class="btn-link">Login / Registo</a>
        </nav>
    </header>

    <section class="carrossel-banner">
        <div class="slide ativa">Equipamentos e Vidrarias Borossilicato de Alta Precisão</div>
        <div class="slide">Reagentes Analíticos P.A. com Entrega Segura</div>
    </section>

    <main class="container-principal">
        <section class="catalogo-section">
            <h2>Catálogo de Produtos</h2>
            <div id="lista-produtos" class="grid-produtos"></div>
        </section>

        <aside class="carrinho-section">
            <h2>Carrinho de Compras</h2>
            <div id="itens-carrinho"></div>
            <div class="carrinho-resumo">
                <p><strong>Total: R$ <span id="total-carrinho">0.00</span></strong></p>
                <label for="forma-pagamento">Pagamento:</label>
                <select id="forma-pagamento">
                    <option value="PIX">PIX</option>
                    <option value="CARTAO_CREDITO">Cartão de Crédito</option>
                    <option value="CARTAO_DEBITO">Cartão de Débito</option>
                    <option value="BOLETO">Boleto</option>
                </select>
                <button onclick="finalizarCompra()" class="btn-checkout">Finalizar Compra</button>
            </div>
        </aside>
    </main>

    <script src="js/carrossel.js"></script>
    <script src="js/carrinho.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('chemlab_usuario'));
        if (user) {
            document.getElementById('usuario-logado').innerText = `Olá, ${user.nome || user.login} | `;
        }
    </script>
</body>
</html>
